<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اولین سایت من</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Arial, sans-serif;
            background: #eef7f1;
            color: #24332b;
        }
        .card {
            width: min(90%, 450px);
            padding: 45px 35px;
            text-align: center;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,.08);
        }
        h1 { font-size: 36px; margin-top: 0; }
        p { font-size: 20px; color: #66736b; }
        input {
            width: 100%;
            padding: 16px;
            margin: 20px 0 12px;
            border: 2px solid #dce8df;
            border-radius: 14px;
            font-size: 18px;
            text-align: right;
            outline: none;
        }
        button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 14px;
            background: #36a269;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #2d8d5b; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="card">
        <section id="welcome">
            <h1>سلام 👋</h1>
            <p>اسم خودت را وارد کن:</p>
            <input id="nameInput" type="text" placeholder="مثلاً نیما">
            <button type="button" onclick="sayHello()">شروع 🚀</button>
        </section>

        <section id="result" class="hidden">
            <h1 id="greeting"></h1>
            <p>خوش اومدی 🌱</p>
            <button type="button" onclick="goBack()">برگشت</button>
        </section>
    </main>

    <script>
        function sayHello() {
            const name = document.getElementById("nameInput").value.trim();

            if (name === "") {
                alert("لطفاً اول اسمت را وارد کن 😊");
                return;
            }

            document.getElementById("greeting").textContent = "سلام " + name + "!";
            document.getElementById("welcome").classList.add("hidden");
            document.getElementById("result").classList.remove("hidden");
        }

        function goBack() {
            document.getElementById("result").classList.add("hidden");
            document.getElementById("welcome").classList.remove("hidden");
            document.getElementById("nameInput").focus();
        }
    </script>
</body>
</html>
